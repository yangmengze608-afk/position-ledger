name: Discover public position disclosures

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/discover-positions.yml"
      - "data/source_accounts.json"
      - "data/creators.json"
      - "scripts/fetch_x_timeline.js"
      - "scripts/fetch_public_portfolios.js"
      - "scripts/tag_creator_ids.js"
      - "scripts/classify_positions.js"
      - "scripts/lib/creator_identity.js"
      - "scripts/lib/position_rules.js"
      - "scripts/lib/portfolio_snapshot_rules.js"
      - "scripts/lib/event_reconciliation.js"
      - "scripts/llm_review.py"
      - "scripts/propose_events.js"
      - "scripts/pr_summary.js"
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: position-discovery
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_MODEL: ${{ vars.LLM_MODEL }}
      LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
      POSITION_LEDGER_REPORT_PATH: /tmp/collector-report.json
      POSITION_LEDGER_PORTFOLIO_REPORT_PATH: /tmp/portfolio-report.json
      POSITION_DISCOVERY_BATCH: ${{ github.run_id }}-${{ github.run_attempt }}
      REVIEW_ISSUE_TITLE: "review: pending position disclosures"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Skip while a previous discovery review is awaiting approval
        id: guard
        shell: bash
        run: |
          pr_count=$(gh pr list --state open --head bot/position-discovery --json number --jq 'length')
          issue_count=$(gh issue list --state open --limit 100 --json title --jq '[.[] | select(.title == "review: pending position disclosures")] | length')
          if [ "$pr_count" != "0" ] || [ "$issue_count" != "0" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "A discovery PR or fallback review issue is still open; skipping this cycle."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch recent public X posts
        id: fetch
        if: steps.guard.outputs.skip != 'true'
        run: node scripts/fetch_x_timeline.js

      - name: Fetch first-party public portfolio snapshots
        id: portfolio
        if: steps.guard.outputs.skip != 'true'
        run: node scripts/fetch_public_portfolios.js

      - name: Resolve creator identity on raw evidence
        id: creator
        if: steps.guard.outputs.skip != 'true'
        run: node scripts/tag_creator_ids.js

      - name: Deterministic conservative triage
        id: classify
        if: steps.guard.outputs.skip != 'true'
        run: node scripts/classify_positions.js

      - name: Optional LLM review for ambiguous candidates
        id: llm
        if: steps.guard.outputs.skip != 'true'
        run: python scripts/llm_review.py

      - name: Propose only high-confidence explicit events
        id: propose
        if: steps.guard.outputs.skip != 'true'
        run: |
          node scripts/propose_events.js
          python scripts/rebuild_holdings.py
          python scripts/validate_data.py
          python scripts/validate_automation.py
          node --test tests/classifier.test.js tests/collector.test.js tests/portfolio-source.test.js tests/reconciliation.test.js tests/queue-upgrade.test.js tests/creator-scope.test.js

      - name: Classify repository changes
        if: steps.guard.outputs.skip != 'true'
        id: diff
        shell: bash
        run: |
          if git diff --quiet -- data/review_queue.json data/events.json data/holdings.json; then
            echo "review_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "review_changed=true" >> "$GITHUB_OUTPUT"
          fi
          if git diff --quiet -- data/raw_posts.json; then
            echo "raw_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "raw_changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare one-shot smoke diagnostics
        if: ${{ always() && github.event_name == 'push' && steps.guard.outputs.skip != 'true' }}
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path

          def load(path, fallback):
              p = Path(path)
              if not p.exists():
                  return fallback
              try:
                  return json.loads(p.read_text())
              except Exception as exc:
                  return {"parseError": str(exc)}

          collector = load('/tmp/collector-report.json', {"missing": True})
          portfolio_collector = load('/tmp/portfolio-report.json', {"missing": True})
          raw = load('data/raw_posts.json', {"posts": []})
          queue = load('data/review_queue.json', {"items": []})
          creator_counts = {}
          for post in raw.get('posts', []) if isinstance(raw, dict) else []:
              cid = post.get('creatorId') or 'serenity'
              creator_counts[cid] = creator_counts.get(cid, 0) + 1
          status = {
              "recordedAt": __import__('datetime').datetime.now(__import__('datetime').timezone.utc).isoformat(),
              "workflowCommit": os.environ.get('GITHUB_SHA'),
              "batchId": os.environ.get('POSITION_DISCOVERY_BATCH'),
              "collector": collector,
              "portfolioCollector": portfolio_collector,
              "rawPostCount": len(raw.get('posts', [])) if isinstance(raw, dict) else None,
              "rawPostsByCreator": creator_counts,
              "reviewQueueCount": len(queue.get('items', [])) if isinstance(queue, dict) else None,
              "changes": {
                  "raw": "${{ steps.diff.outputs.raw_changed }}",
                  "review": "${{ steps.diff.outputs.review_changed }}"
              },
              "stepsReached": {
                  "guard": "${{ steps.guard.outcome }}",
                  "fetch": "${{ steps.fetch.outcome }}",
                  "portfolio": "${{ steps.portfolio.outcome }}",
                  "creator": "${{ steps.creator.outcome }}",
                  "classify": "${{ steps.classify.outcome }}",
                  "llm": "${{ steps.llm.outcome }}",
                  "propose": "${{ steps.propose.outcome }}"
              }
          }
          Path('/tmp/discovery-smoke-status.json').write_text(json.dumps(status, indent=2) + '\n')
          PY

      - name: Persist raw-only ingest cache without human review
        if: steps.guard.outputs.skip != 'true' && steps.diff.outputs.review_changed != 'true' && steps.diff.outputs.raw_changed == 'true'
        shell: bash
        run: |
          git config user.name "position-ledger-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw_posts.json
          git commit -m "data: archive newly discovered public posts"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Publish review request
        id: delivery
        if: steps.guard.outputs.skip != 'true' && steps.diff.outputs.review_changed == 'true'
        shell: bash
        run: |
          git config user.name "position-ledger-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C bot/position-discovery
          git add data/raw_posts.json data/review_queue.json data/events.json data/holdings.json
          git commit -m "data: propose newly discovered position disclosures"
          git push --force-with-lease origin bot/position-discovery
          node scripts/pr_summary.js > /tmp/pr-body.md

          if pr_url=$(gh pr create \
            --base main \
            --head bot/position-discovery \
            --title "data: review newly discovered position disclosures" \
            --body-file /tmp/pr-body.md 2>/tmp/pr-error.log); then
            echo "kind=pr" >> "$GITHUB_OUTPUT"
            echo "url=$pr_url" >> "$GITHUB_OUTPUT"
            echo "Created review PR: $pr_url"
          else
            echo "GitHub Actions could not create a PR; falling back to an issue." >&2
            cat /tmp/pr-error.log >&2 || true
            compare_url="https://github.com/${GITHUB_REPOSITORY}/compare/main...bot/position-discovery?expand=1"
            {
              echo "The discovery bot found position disclosures and pushed the review branch, but the repository currently blocks GITHUB_TOKEN from creating pull requests."
              echo
              echo "Create/review the PR here: ${compare_url}"
              echo
              echo "---"
              cat /tmp/pr-body.md
            } > /tmp/issue-body.md
            issue_url=$(gh issue create --title "$REVIEW_ISSUE_TITLE" --body-file /tmp/issue-body.md)
            echo "kind=issue" >> "$GITHUB_OUTPUT"
            echo "url=$issue_url" >> "$GITHUB_OUTPUT"
            echo "Created fallback review issue: $issue_url"
          fi

      - name: Persist smoke diagnostics and delivery outcome
        if: ${{ always() && github.event_name == 'push' && steps.guard.outputs.skip != 'true' }}
        env:
          DELIVERY_KIND: ${{ steps.delivery.outputs.kind }}
          DELIVERY_URL: ${{ steps.delivery.outputs.url }}
        shell: bash
        run: |
          git switch main
          git pull --ff-only origin main
          python - <<'PY'
          import json, os
          from pathlib import Path
          source = Path('/tmp/discovery-smoke-status.json')
          try:
              status = json.loads(source.read_text())
          except Exception:
              status = {
                  'recordedAt': __import__('datetime').datetime.now(__import__('datetime').timezone.utc).isoformat(),
                  'workflowCommit': os.environ.get('GITHUB_SHA'),
                  'batchId': os.environ.get('POSITION_DISCOVERY_BATCH'),
              }
          status['delivery'] = {
              'kind': os.environ.get('DELIVERY_KIND') or 'none',
              'url': os.environ.get('DELIVERY_URL') or None,
          }
          Path('data/automation_status.json').write_text(json.dumps(status, indent=2) + '\n')
          PY
          git config user.name "position-ledger-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/automation_status.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: record discovery smoke status"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
