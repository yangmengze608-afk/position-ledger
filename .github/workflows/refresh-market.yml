name: Refresh market snapshot

on:
  push:
    branches: ["main"]
    paths:
      - "data/symbols.json"
  workflow_dispatch:
  schedule:
    - cron: "17,47 12-22 * * 1-5"

permissions:
  contents: write

concurrency:
  group: market-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/refresh_market.py
      - name: Commit quote changes
        run: |
          git config user.name "position-ledger-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market.json
          if git diff --cached --quiet; then
            echo "No market changes"
          else
            git commit -m "data: refresh market snapshot"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
