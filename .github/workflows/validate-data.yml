name: Validate ledger data

on:
  push:
    paths:
      - "data/**"
      - "scripts/**"
  pull_request:
    paths:
      - "data/**"
      - "scripts/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/validate_data.py
      - name: Ensure generated holdings are committed
        run: git diff --exit-code data/holdings.json
