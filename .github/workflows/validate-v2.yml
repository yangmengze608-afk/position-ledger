name: Validate V2 automation

on:
  push:
    paths:
      - "data/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/**"
      - "app.js"
      - "performance-ui.js"
      - "terminal-ui.js"
      - "evidence-drawer-ui.js"
      - "mentions-ui.js"
      - "config.js"
      - "index.html"
      - "styles.css"
      - "performance.css"
      - "terminal.css"
      - "evidence-drawer.css"
      - "mentions.css"
      - "vercel.json"
  pull_request:
    paths:
      - "data/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/**"
      - "app.js"
      - "performance-ui.js"
      - "terminal-ui.js"
      - "evidence-drawer-ui.js"
      - "mentions-ui.js"
      - "config.js"
      - "index.html"
      - "styles.css"
      - "performance.css"
      - "terminal.css"
      - "evidence-drawer.css"
      - "mentions.css"
      - "vercel.json"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check --quiet pyyaml
      - run: python scripts/validate_data.py
      - run: python scripts/validate_automation.py
      - run: node --test tests/classifier.test.js tests/collector.test.js tests/reconciliation.test.js tests/queue-upgrade.test.js
      - run: python -m unittest tests/test_resolutions.py tests/test_market.py
      - name: Validate frontend syntax and config
        run: |
          node --check app.js
          node --check performance-ui.js
          node --check terminal-ui.js
          node --check evidence-drawer-ui.js
          node --check mentions-ui.js
          node --check config.js
          python -m json.tool vercel.json >/dev/null
      - name: Ensure generated holdings are committed
        run: |
          python scripts/rebuild_holdings.py
          git diff --exit-code data/holdings.json
